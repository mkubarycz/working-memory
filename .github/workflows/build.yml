name: Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install desktop UI dependencies
        run: npm ci --prefix desktop-ui

      - name: Compile
        run: npm run compile

      - name: Build desktop UI
        run: npm run compile:desktop

      - name: Test
        run: npm test

      - name: Test desktop UI
        run: npm test --prefix desktop-ui
