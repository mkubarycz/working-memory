name: Build VSIX

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Stage codicons
        run: |
          mkdir -p media/codicons
          cp node_modules/@vscode/codicons/dist/codicon.css media/codicons/codicon.css
          cp node_modules/@vscode/codicons/dist/codicon.ttf media/codicons/codicon.ttf

      - name: Compile
        run: npm run compile

      - name: Test
        run: npm test

      - name: Package VSIX
        run: npx vsce package --allow-missing-repository --no-dependencies

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: working-memory-vsix
          path: '*.vsix'
          retention-days: 14
