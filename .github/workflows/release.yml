name: Installers

# PRs and pushes to main build installers as workflow artifacts. Pushing a v* tag
# also publishes them as a GitHub Release (0.x and suffixed versions are prereleases).
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Installer version (for example 0.16.1). Defaults to desktop-ui/package.json.'
        required: false

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          elif [[ -n "$INPUT_VERSION" ]]; then
            version="$INPUT_VERSION"
          else
            base="$(node -p "require('./desktop-ui/package.json').version")"
            version="${base}-build.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  backend:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            os: ubuntu-24.04-arm
          - arch: amd64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          docker build --platform linux/${{ matrix.arch }} --tag "working-memory-control-plane:$VERSION" .
          docker run --detach --network none --name backend-smoke "working-memory-control-plane:$VERSION"
          trap 'docker logs backend-smoke; docker rm --force backend-smoke' EXIT
          healthy=false
          for attempt in {1..30}; do
            if docker exec backend-smoke node -e "fetch('http://127.0.0.1:7717/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"; then
              healthy=true
              break
            fi
            sleep 2
          done
          if [[ "$healthy" != true ]]; then
            echo "Prebuilt backend failed its offline health check" >&2
            exit 1
          fi
          docker save --output "$RUNNER_TEMP/image.tar" "working-memory-control-plane:$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: backend-${{ matrix.arch }}
          path: ${{ runner.temp }}/image.tar
          compression-level: 1
          if-no-files-found: error

  package:
    needs: [version, backend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
            arch: arm64
          - os: windows-latest
            target: win
            arch: amd64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            desktop-ui/package-lock.json

      - name: Download prebuilt backend image
        uses: actions/download-artifact@v4
        with:
          name: backend-${{ matrix.arch }}
          path: backend-image

      - name: Install dependencies
        run: npm ci

      - name: Install desktop UI dependencies
        run: npm ci --prefix desktop-ui

      - name: Compile
        run: npm run compile

      - name: Test desktop UI
        if: matrix.target == 'mac'
        run: npm test --prefix desktop-ui

      - name: Build installer
        # PowerShell splits `-c.extraMetadata.version=...` into two arguments.
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # mac.identity is explicitly '-' (ad-hoc); no signing credentials are used.
          CSC_FOR_PULL_REQUEST: 'true'
          WM_DATA_TIER_IMAGE_ARCHIVE: ${{ github.workspace }}/backend-image/image.tar
        run: npm run package:${{ matrix.target }} --prefix desktop-ui -- -c.extraMetadata.version=${{ needs.version.outputs.version }}

      - name: Verify packaged macOS signatures
        if: matrix.target == 'mac'
        run: bash scripts/verify-mac-installers.sh desktop-ui/release

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: working-memory-${{ matrix.target }}-${{ needs.version.outputs.version }}
          if-no-files-found: error
          path: |
            desktop-ui/release/*.dmg
            desktop-ui/release/*.zip
            desktop-ui/release/*.exe

  publish:
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
          pattern: working-memory-*

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          prerelease=()
          if [[ "$version" == 0.* || "$version" == *-* ]]; then prerelease=(--prerelease); fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" installers/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" installers/* --title "Working Memory $version" --generate-notes "${prerelease[@]}"
          fi
