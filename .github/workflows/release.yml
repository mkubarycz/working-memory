name: Release VSIX

on:
  push:
    tags:
      - 'v*'

jobs:
  verify:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is on main
        run: |
          git fetch --no-tags origin main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag commit is on main — proceeding with release."
          else
            echo "::error::Tag $GITHUB_REF_NAME ($GITHUB_SHA) is not on main; refusing to release a feature-branch tag." >&2
            exit 1
          fi

  build:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            platform: linux
            arch: x64
          - target: win32-x64
            platform: win32
            arch: x64
          - target: darwin-x64
            platform: darwin
            arch: x64
          - target: darwin-arm64
            platform: darwin
            arch: arm64

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install desktop UI dependencies for target
        env:
          npm_config_platform: ${{ matrix.platform }}
          npm_config_arch: ${{ matrix.arch }}
        run: npm ci --prefix desktop-ui

      - name: Set version from tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Stage codicons
        run: |
          mkdir -p media/codicons
          cp node_modules/@vscode/codicons/dist/codicon.css media/codicons/codicon.css
          cp node_modules/@vscode/codicons/dist/codicon.ttf media/codicons/codicon.ttf

      - name: Compile
        run: npm run compile

      - name: Build desktop UI
        run: npm run compile:desktop

      - name: Test
        run: npm test

      - name: Test desktop UI
        run: npm test --prefix desktop-ui

      - name: Package VSIX
        env:
          npm_config_platform: ${{ matrix.platform }}
          npm_config_arch: ${{ matrix.arch }}
          WM_DESKTOP_PLATFORM: ${{ matrix.platform }}
          WM_DESKTOP_ARCH: ${{ matrix.arch }}
        run: |
          # Do NOT pass --no-dependencies: it skips the dependency walk that
          # bundles the runtime node_modules the control-plane daemon needs.
          npx vsce package \
            --target "${{ matrix.target }}" \
            --out "working-memory-${{ matrix.target }}.vsix" \
            --allow-missing-repository
          # Guard: fail the release if the daemon's prod deps aren't bundled.
          unzip -l "working-memory-${{ matrix.target }}.vsix" | grep -q 'node_modules/@modelcontextprotocol/sdk/' \
            || { echo "::error::vsix is missing node_modules/@modelcontextprotocol/sdk — daemon would not start"; exit 1; }
          unzip -p "working-memory-${{ matrix.target }}.vsix" extension/desktop-ui/runtime/launch.json \
            | grep -q "\"platform\": \"${{ matrix.platform }}\"" \
            || { echo "::error::vsix contains the wrong desktop runtime platform"; exit 1; }
          unzip -p "working-memory-${{ matrix.target }}.vsix" extension/desktop-ui/runtime/launch.json \
            | grep -q "\"arch\": \"${{ matrix.arch }}\"" \
            || { echo "::error::vsix contains the wrong desktop runtime architecture"; exit 1; }

      - name: Upload targeted VSIX
        uses: actions/upload-artifact@v4
        with:
          name: release-vsix-${{ matrix.target }}
          path: working-memory-${{ matrix.target }}.vsix
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download targeted VSIX files
        uses: actions/download-artifact@v4
        with:
          pattern: release-vsix-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: working-memory-*.vsix
