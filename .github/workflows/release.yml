name: Installers

# PRs and pushes to main build installers as workflow artifacts. Pushing a v* tag
# also publishes them as a GitHub Release (0.x and suffixed versions are prereleases).
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Installer version (for example 0.16.1). Defaults to desktop-ui/package.json.'
        required: false

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
          - os: windows-latest
            target: win
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            desktop-ui/package-lock.json

      - name: Resolve version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          elif [[ -n "$INPUT_VERSION" ]]; then
            version="$INPUT_VERSION"
          else
            # Untagged builds need a unique version: it tags the bundled data-tier image,
            # and an unchanged tag would keep running an older control plane.
            base="$(node -p "require('./desktop-ui/package.json').version")"
            version="${base}-build.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Install desktop UI dependencies
        run: npm ci --prefix desktop-ui

      - name: Compile
        run: npm run compile

      - name: Test desktop UI
        if: matrix.target == 'mac'
        run: npm test --prefix desktop-ui

      - name: Build installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run package:${{ matrix.target }} --prefix desktop-ui -- -c.extraMetadata.version=${{ steps.version.outputs.version }}

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: working-memory-${{ matrix.target }}-${{ steps.version.outputs.version }}
          if-no-files-found: error
          path: |
            desktop-ui/release/*.dmg
            desktop-ui/release/*.zip
            desktop-ui/release/*.exe

  publish:
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          prerelease=()
          if [[ "$version" == 0.* || "$version" == *-* ]]; then prerelease=(--prerelease); fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" installers/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" installers/* --title "Working Memory $version" --generate-notes "${prerelease[@]}"
          fi
